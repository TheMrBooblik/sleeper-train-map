name: Probe NightJet source

# Everything nightjet.com lists over the coming weeks, against the committed
# nightjet-trains.json: trains the scrape does not carry (and whether they fall
# inside the adapter's discovery window), whether country codes beyond the
# registry's six list anything more, and the raw shape of the endpoints. The
# dev sandbox has no egress to nightjet.com; see scripts/probe-nightjet.mjs.
#
# Label a PR `run-probes` to run it from the PR head — a workflow_dispatch probe
# cannot run until its file is on the default branch (see CLAUDE.md).
#
# Read-only: GET requests, nothing committed.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  probe:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-probes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Probe
        run: |
          set -o pipefail
          node scripts/probe-nightjet.mjs probe-output | tee probe-output.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightjet-probe-output
          path: |
            probe-output/
            probe-output.log
          retention-days: 7
