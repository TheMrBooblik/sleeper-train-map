name: Probe ONCF source

# One-shot reconnaissance for the ONCF (Moroccan Railways) adapter. The dev
# sandbox has no egress to oncf.ma / oncf-voyages.ma, and the published
# community GTFS (mdb-3049) expired 2025-12-31 with zero overnight trips — so
# we probe the official surfaces from CI to find a stable night-train source.
#
# Dispatch it, download the artifact, then implement scripts/adapters/oncf.mjs
# against real responses and flip the registry oncf entry to enabled:true.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: node scripts/probe-oncf.mjs probe-output
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oncf-probe-output
          path: probe-output/
          retention-days: 7
