name: Planner Build Smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/plan

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build

      - name: Smoke test built app
        run: npx playwright test --config=playwright.build.config.js
