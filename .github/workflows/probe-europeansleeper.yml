name: Probe European Sleeper source

# One-shot reconnaissance for the europeansleeper adapter (the dev sandbox has
# no egress to europeansleeper.eu). Dispatch it, download the artifact, then
# finalize parseTimetableHtml() in scripts/adapters/europeansleeper.mjs and
# flip the registry entry to enabled:true.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: node scripts/probe-europeansleeper.mjs probe-output

      - uses: actions/upload-artifact@v4
        with:
          name: es-probe-output
          path: probe-output/
          retention-days: 7
