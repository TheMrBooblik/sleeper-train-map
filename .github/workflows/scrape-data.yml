name: Daily data scrape

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run scrape

      # Pre-merge the scraped sources into the published dataset that
      # /api/initial-data serves directly (falls back to on-the-fly merge if absent).
      - run: npm run canonicalize

      # Refresh PKP GTFS shapes on Mondays so seasonal summer trains get picked
      # up when PKP Intercity adds them to the live GTFS feed (mkuran.pl).
      - name: Refresh PKP GTFS shapes (weekly)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run parse-pkp-gtfs
          fi

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily data scrape [skip ci]"
          file_pattern: "public/data/scraped/*.json public/data/published/*.json public/data/gtfs/pkpTrainShapes.json"
        env:
          HUSKY: "0"
