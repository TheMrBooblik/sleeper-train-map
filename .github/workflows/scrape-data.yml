name: Daily data scrape

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Never let two scrape runs race to push main: a queued run waits for the
# in-flight one to finish. Removes the main source of non-fast-forward pushes.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    steps:
      # Full history so we can rebase our data commit onto main if it moved
      # while the scrape was running (see the commit step below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # PLK_API_KEY: official PLK "Otwarte Dane Kolejowe" API key, consumed by the
      # pkp-plk adapter to enrich PKP station info. Optional — absent key just
      # leaves the GTFS bundle as-is. Add it as a repo secret to enable.
      - run: npm run scrape
        env:
          PLK_API_KEY: ${{ secrets.PLK_API_KEY }}

      # Classify tonight's changes BEFORE canonicalize: new trains/stations
      # file proposals on the `proposals` branch (reviewed in /data) and update
      # the seen index — including auto-approvals from trusted sources, so they
      # go live the same night. Best-effort — a classify failure must not block
      # the data refresh (new routes just stay gated one extra night).
      - name: Classify changes → review queue
        run: node scripts/classify-changes.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pre-merge the scraped sources into the published dataset that
      # /api/initial-data serves directly (falls back to on-the-fly merge if absent).
      # Routes/stations not yet approved in data/canonical/state/seen.json are
      # withheld here (review gate).
      - run: npm run canonicalize

      # AI assist (GitHub Models, free tier): enrich tonight's proposals,
      # suggest station aliases, extract prices from configured pages.
      # Strictly best-effort and budget-capped — never blocks the pipeline.
      - name: AI assist (best effort)
        run: node scripts/ai-tasks.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MAX_REQUESTS: "40"

      # Weekly price probes (Mondays): sample operator booking APIs ~30 days
      # out; new/changed from-prices become review-queue proposals.
      - name: Price probes (weekly)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/probe-prices.mjs
          fi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PKP GTFS shapes are refreshed inside `npm run scrape` now: the pkp-gtfs
      # registry entry is a daily external-runner step, so the bundle is fresh
      # before the enrichment post-step stamps PKP rows.

      # Commit tonight's regenerated data and push it to main. If main advanced
      # while we were running (a concurrent commit, or a manual push), rebase our
      # data commit onto the new tip and retry. Regenerated files always win on
      # conflict (-X theirs): they are a fresh, complete source-of-truth snapshot,
      # so overwriting is correct. Bounded retries so a real problem still fails
      # loudly. Replaces the git-auto-commit action (also drops its Node 20 runtime).
      - name: Commit & push regenerated data
        env:
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/scraped/*.json public/data/published/*.json public/data/gtfs/pkpTrainShapes.json data/canonical/state/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: daily data scrape [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — main moved; rebasing onto latest."
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "Rebase hit an unresolvable conflict; aborting."
              exit 1
            fi
          done
          echo "Failed to push after retries."
          exit 1
