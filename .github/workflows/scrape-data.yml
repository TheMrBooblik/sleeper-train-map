name: Daily data scrape

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run scrape

      # Pre-merge the scraped sources into the published dataset that
      # /api/initial-data serves directly (falls back to on-the-fly merge if absent).
      # Routes/stations not yet approved in data/canonical/state/seen.json are
      # withheld here (review gate).
      - run: npm run canonicalize

      # Classify tonight's changes: new trains/stations file proposals on the
      # `proposals` branch (reviewed in /data) and update the seen index.
      # Best-effort — a classify failure must not block the data refresh.
      - name: Classify changes → review queue
        run: node scripts/classify-changes.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # AI assist (GitHub Models, free tier): enrich tonight's proposals,
      # suggest station aliases, extract prices from configured pages.
      # Strictly best-effort and budget-capped — never blocks the pipeline.
      - name: AI assist (best effort)
        run: node scripts/ai-tasks.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MAX_REQUESTS: "40"

      # Weekly price probes (Mondays): sample operator booking APIs ~30 days
      # out; new/changed from-prices become review-queue proposals.
      - name: Price probes (weekly)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/probe-prices.mjs
          fi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Refresh PKP GTFS shapes on Mondays so seasonal summer trains get picked
      # up when PKP Intercity adds them to the live GTFS feed (mkuran.pl).
      - name: Refresh PKP GTFS shapes (weekly)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run parse-pkp-gtfs
          fi

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily data scrape [skip ci]"
          file_pattern: "public/data/scraped/*.json public/data/published/*.json public/data/gtfs/pkpTrainShapes.json data/canonical/state/*.json"
        env:
          HUSKY: "0"
