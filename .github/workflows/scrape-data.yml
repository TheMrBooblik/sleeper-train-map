name: Daily data scrape

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run scrape

      # Pre-merge the scraped sources into the published dataset that
      # /api/initial-data serves directly (falls back to on-the-fly merge if absent).
      - run: npm run canonicalize

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily data scrape [skip ci]"
          file_pattern: "public/data/scraped/*.json public/data/published/*.json"
        env:
          HUSKY: "0"
